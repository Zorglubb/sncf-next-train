<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochains Trains</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --row-bg: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #4ade80;
      --warning: #f87171;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .destination {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .target-city {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 4px;
    }
    .train-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .train-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--row-bg);
      padding: 14px 16px;
      border-radius: 14px;
    }
    .train-row:first-child {
      border-left: 4px solid var(--accent);
    }
    .time-col {
      display: flex;
      flex-direction: column;
    }
    .time-depart {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .time-arrivee {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .status-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .badge.on-time { background: rgba(74, 222, 128, 0.15); color: var(--success); }
    .badge.late { background: rgba(248, 113, 113, 0.15); color: var(--warning); }
    .duration {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .btn-more {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--muted);
      color: var(--muted);
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-more:active {
      background: rgba(255,255,255,0.05);
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      background: #475569;
      border: none;
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-action:active {
      background: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="destination">Direction</div>
      <div class="target-city" id="direction">Chargement...</div>
    </div>

    <div class="train-list" id="trains-container">
      <div style="text-align: center; color: var(--muted); padding: 20px;">Recherche des trains...</div>
    </div>

    <button id="btn-see-more" class="btn-more" onclick="loadMore()">+ Voir 4 trains de plus</button>

    <div class="btn-group">
      <button class="btn-action" onclick="resetAndFetch()">🔄 Actualiser</button>
      <button class="btn-action" onclick="toggleDirection()">⇄ Inverser</button>
    </div>
  </div>

  <script>
    let overrideDirection = null;
    let currentLimit = 4;

    async function fetchTrains(limit = 4) {
      const dirElem = document.getElementById('direction');
      const container = document.getElementById('trains-container');
      const moreBtn = document.getElementById('btn-see-more');

      let url = `/api?count=${limit}`;
      if (overrideDirection) {
        url += `&dir=${overrideDirection}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error || !data.trains) {
          dirElem.textContent = "Aucun train";
          container.innerHTML = `<div style="text-align:center; color: var(--warning); padding: 15px;">${data.error || 'Erreur'}</div>`;
          moreBtn.style.display = 'none';
          return;
        }

        dirElem.textContent = data.destination;
        container.innerHTML = '';

        data.trains.forEach((train) => {
          const row = document.createElement('div');
          row.className = 'train-row';
          row.innerHTML = `
            <div class="time-col">
              <span class="time-depart">${train.depart}</span>
              <span class="time-arrivee">Arrivée : ${train.arrivee}</span>
            </div>
            <div class="status-col">
              <span class="badge ${train.estEnRetard ? 'late' : 'on-time'}">${train.retard}</span>
              <span class="duration">${train.duree}</span>
            </div>
          `;
          container.appendChild(row);
        });

        // Masquer le bouton si on a déjà chargé l'extension ou s'il n'y a plus de trains
        if (limit > 4 || data.trains.length < 4) {
          moreBtn.style.display = 'none';
        } else {
          moreBtn.style.display = 'block';
          moreBtn.textContent = '+ Voir 4 trains de plus';
        }

      } catch (err) {
        container.innerHTML = `<div style="text-align:center; color: var(--warning); padding: 15px;">Erreur de connexion</div>`;
      }
    }

    function loadMore() {
      const moreBtn = document.getElementById('btn-see-more');
      moreBtn.textContent = 'Chargement...';
      currentLimit = 8;
      fetchTrains(currentLimit);
    }

    function resetAndFetch() {
      currentLimit = 4;
      fetchTrains(currentLimit);
    }

    function toggleDirection() {
      const currentDir = document.getElementById('direction').textContent.toLowerCase();
      overrideDirection = currentDir.includes('bourges') ? 'vierzon' : 'bourges';
      resetAndFetch();
    }

    resetAndFetch();
  </script>
</body>
</html>
