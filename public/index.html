<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochains Départs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: #0d131f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .widget {
      width: 100%;
      max-width: 380px;
      background: #141c2b;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    .header-sub {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
    }
    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }
    .train-card {
      background: #1c2637;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #38bdf8;
    }
    .train-card.delayed {
      border-left-color: #f97316;
    }
    .train-card.cancelled {
      border-left-color: #ef4444;
      opacity: 0.6;
    }
    .times-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dep-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .time-main {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    .time-main.delayed {
      color: #f97316;
    }
    .time-strike {
      font-size: 13px;
      color: #64748b;
      text-decoration: line-through;
    }
    .arr-row {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .arr-time.delayed {
      color: #f97316;
      font-weight: 600;
    }
    .right-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .badge.ontime {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .badge.delayed {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
    }
    .badge.cancelled {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-voie {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }
    .train-num {
      font-size: 11px;
      color: #64748b;
    }
    .btn-more {
      width: 100%;
      background: transparent;
      border: 1px dashed #334155;
      color: #94a3b8;
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .btn-more:hover {
      background: #1e293b;
      color: #ffffff;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: none;
      background: #273449;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <div class="header-sub">DIRECTION</div>
      <div class="header-title" id="destinationLabel">Bourges</div>
    </div>

    <div id="trainsContainer">Chargement...</div>

    <button id="btnMore" class="btn-more" style="display: none;" onclick="loadMoreTrains()">
      + Voir 4 trains de plus
    </button>

    <div class="actions">
      <button class="btn" onclick="refreshTrains()">🔄 Actualiser</button>
      <button class="btn" id="toggleDirBtn" onclick="toggleDir()">→ Vierzon</button>
    </div>
  </div>

  <script>
    let currentDir = null;
    let currentOffset = 0;

    function renderTrains(trains, append = false) {
      const container = document.getElementById('trainsContainer');
      if (!append) container.innerHTML = '';

      trains.forEach((t) => {
        const isLate = t.estEnRetard && t.retardMinutes > 0;
        const isCanc = t.estSupprime;

        const card = document.createElement('div');
        card.className = `train-card ${isLate ? 'delayed' : ''} ${isCanc ? 'cancelled' : ''}`;

        const voieBadge = t.voie ? `<span class="badge-voie">Voie ${t.voie}</span>` : '';

        card.innerHTML = `
          <div class="times-col">
            <div class="dep-row">
              <span class="time-main ${isLate ? 'delayed' : ''}">
                ${isLate ? t.departReel : t.departTheorique}
              </span>
              ${isLate ? `<span class="time-strike">${t.departTheorique}</span>` : ''}
            </div>
            <div class="arr-row">
              Arrivée : 
              <span class="arr-time ${isLate ? 'delayed' : ''}">
                ${isLate ? t.arriveeReelle : t.arriveeTheorique}
              </span>
              <span>(${t.duree})</span>
            </div>
          </div>
          <div class="right-col">
            <span class="badge ${isCanc ? 'cancelled' : isLate ? 'delayed' : 'ontime'}">
              ${t.retard}
            </span>
            <div class="meta-row">
              ${voieBadge}
              <span class="train-num">N° ${t.numero}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function fetchTrains(append = false) {
      const params = new URLSearchParams(window.location.search);
      if (currentDir) params.set('dir', currentDir);
      params.set('offset', currentOffset);

      const res = await fetch('/api?' + params.toString());
      const data = await res.json();

      document.getElementById('destinationLabel').innerText = data.destination;

      // Bouton directionnel : propose la direction opposée
      const isBourges = data.destination.toLowerCase().includes('bourges');
      document.getElementById('toggleDirBtn').innerText = isBourges ? '→ Vierzon' : '→ Bourges';

      renderTrains(data.trains, append);

      const btnMore = document.getElementById('btnMore');
      btnMore.style.display = data.hasMore ? 'block' : 'none';
    }

    function refreshTrains() {
      currentOffset = 0;
      fetchTrains(false);
    }

    function loadMoreTrains() {
      currentOffset += 4;
      fetchTrains(true);
    }

    function toggleDir() {
      const current = document.getElementById('destinationLabel').innerText.toLowerCase();
      currentDir = current.includes('bourges') ? 'vierzon' : 'bourges';
      currentOffset = 0;
      fetchTrains(false);
    }

    fetchTrains(false);
  </script>
</body>
</html>
