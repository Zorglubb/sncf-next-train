<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prochains Départs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .widget {
      width: 100%;
      max-width: 400px;
      background: #151d2a;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-sub {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #64748b;
      font-weight: 700;
    }
    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 4px;
    }
    .train-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #38bdf8;
    }
    .train-card.delayed {
      border-left-color: #f97316;
    }
    .train-card.cancelled {
      border-left-color: #ef4444;
      opacity: 0.6;
    }
    .times-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .dep-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .time-main {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    .time-main.delayed {
      color: #f97316; /* Orange SNCF */
    }
    .time-strike {
      font-size: 14px;
      color: #64748b;
      text-decoration: line-through;
    }
    .arr-row {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .arr-time.delayed {
      color: #f97316;
      font-weight: 600;
    }
    .right-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge.ontime {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .badge.delayed {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
    }
    .badge.cancelled {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .train-num {
      font-size: 12px;
      color: #64748b;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #334155;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <div class="header-sub">DIRECTION</div>
      <div class="header-title" id="destinationLabel">Bourges</div>
    </div>

    <div id="trainsContainer">Chargement...</div>

    <div class="actions">
      <button class="btn" onclick="fetchTrains()">🔄 Actualiser</button>
      <button class="btn" id="toggleDirBtn" onclick="toggleDir()">⇄ Inverser</button>
    </div>
  </div>

  <script>
    let currentDir = null;

    async function fetchTrains() {
      const urlParams = new URLSearchParams(window.location.search);
      if (currentDir) urlParams.set('dir', currentDir);
      
      const res = await fetch('/api?' + urlParams.toString());
      const data = await res.json();

      document.getElementById('destinationLabel').innerText = data.destination;
      const container = document.getElementById('trainsContainer');
      container.innerHTML = '';

      data.trains.forEach((t) => {
        const isLate = t.estEnRetard && t.retardMinutes > 0;
        const isCanc = t.estSupprime;

        const card = document.createElement('div');
        card.className = `train-card ${isLate ? 'delayed' : ''} ${isCanc ? 'cancelled' : ''}`;

        card.innerHTML = `
          <div class="times-col">
            <div class="dep-row">
              <span class="time-main ${isLate ? 'delayed' : ''}">
                ${isLate ? t.departReel : t.departTheorique}
              </span>
              ${isLate ? `<span class="time-strike">${t.departTheorique}</span>` : ''}
            </div>
            <div class="arr-row">
              Arrivée : 
              <span class="arr-time ${isLate ? 'delayed' : ''}">
                ${isLate ? t.arriveeReelle : t.arriveeTheorique}
              </span>
              <span>(${t.duree})</span>
            </div>
          </div>
          <div class="right-col">
            <span class="badge ${isCanc ? 'cancelled' : isLate ? 'delayed' : 'ontime'}">
              ${t.retard}
            </span>
            <span class="train-num">N° ${t.numero}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleDir() {
      const current = document.getElementById('destinationLabel').innerText.toLowerCase();
      currentDir = current.includes('bourges') ? 'vierzon' : 'bourges';
      fetchTrains();
    }

    fetchTrains();
  </script>
</body>
</html>
